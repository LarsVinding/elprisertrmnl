name: Opdater TRMNL Elpriser

on:
  schedule:
    # Kl. 00:05 dansk tid (23:05 UTC om vinteren)
    - cron: '5 23 * * *'
    # Kl. 13:15 dansk tid (12:15 UTC om vinteren)
    - cron: '15 12 * * *'
  # Gør det muligt at teste og køre manuelt fra GitHubs interface
  workflow_dispatch:

jobs:
  update-elpriser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
      - name: Hent kildekode
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer afhængigheder
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kør elpris-opdatering
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: |
          python trmnl_elpriser.py
